<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Color Switch Rush</title>
<script src="https://www.youtube.com/game_api/v1"><\/script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#07080F;overscroll-behavior:none;touch-action:none;user-select:none;font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
#game{display:block;width:100%;height:100%;background:radial-gradient(120% 80% at 50% 0%,#1a1d3a 0%,#0a0c1c 50%,#07080F 100%)}
#ui{position:fixed;inset:0;pointer-events:none}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 18px;pointer-events:none}
.hud-item{background:rgba(15,18,35,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;gap:1px;min-width:72px}
.hud-label{font-size:10px;letter-spacing:0.12em;color:rgba(255,255,255,0.45);font-weight:600}
.hud-value{font-size:18px;font-weight:800;color:#fff;letter-spacing:-0.02em;line-height:1}
#multiplier{position:absolute;left:50%;top:78px;transform:translateX(-50%);background:rgba(15,18,35,0.9);border:1px solid rgba(255,255,255,0.1);border-radius:999px;padding:6px 16px;display:flex;align-items:center;gap:8px;opacity:0;transition:opacity 0.25s}
#multiplier.show{opacity:1}
#multiplier-dot{width:8px;height:8px;border-radius:50%;background:#FFCC00;box-shadow:0 0 12px #FFCC00}
#multiplier-txt{font-size:13px;font-weight:700;color:#fff;letter-spacing:0.02em}
#speedup{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:0.15em;opacity:0;pointer-events:none;text-shadow:0 0 20px rgba(255,255,255,0.8),0 0 40px rgba(76,217,100,0.6);transition:opacity 0.3s}
#speedup.show{opacity:1;animation:speedPop 0.6s ease}
@keyframes speedPop{0%{transform:translate(-50%,-50%) scale(0.8)}50%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(100% 70% at 50% 30%,rgba(26,29,58,0.9) 0%,rgba(7,8,15,0.96) 80%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto;opacity:0;visibility:hidden;transition:opacity 0.35s,visibility 0.35s;padding:24px;text-align:center}
.screen.active{opacity:1;visibility:visible}
.title{font-size:clamp(32px,8vw,52px);font-weight:900;letter-spacing:-0.04em;line-height:0.9;color:#fff;margin-bottom:12px;text-shadow:0 0 30px rgba(255,255,255,0.35)}
.title span{background:linear-gradient(90deg,#FF3B30,#FFCC00,#4CD964,#007AFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:14px;color:rgba(255,255,255,0.55);max-width:320px;line-height:1.5;margin-bottom:28px}
.dots{display:flex;gap:10px;margin-bottom:28px}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 14px currentColor}
.btn{appearance:none;border:none;border-radius:999px;padding:14px 32px;font-size:15px;font-weight:700;letter-spacing:0.02em;cursor:pointer;transition:transform 0.12s,box-shadow 0.2s,opacity 0.2s;pointer-events:auto;min-width:180px}
.btn:active{transform:scale(0.96)}
.btn-primary{background:#fff;color:#07080F;box-shadow:0 6px 20px rgba(255,255,255,0.25),0 0 0 1px rgba(255,255,255,0.1) inset}
.btn-primary:hover{box-shadow:0 8px 28px rgba(255,255,255,0.35)}
.btn-ghost{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.14)}
.btn-ghost:hover{background:rgba(255,255,255,0.12)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.score-big{font-size:56px;font-weight:900;color:#fff;letter-spacing:-0.03em;line-height:1;margin-bottom:4px}
.score-label{font-size:11px;letter-spacing:0.14em;color:rgba(255,255,255,0.5);font-weight:600;text-transform:uppercase;margin-bottom:20px}
.crash-reason{font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:18px;max-width:280px;line-height:1.4}
.color-preview{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:999px;padding:6px 14px 6px 6px;margin-bottom:18px}
.color-preview-ball{width:26px;height:26px;border-radius:50%;box-shadow:0 0 12px currentColor}
.legend{display:flex;gap:8px;margin-top:18px;opacity:0.7}
.legend span{font-size:10px;color:rgba(255,255,255,0.6);letter-spacing:0.08em}
.hint{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:0.06em;pointer-events:none}
</style>
</head><body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="hud">
    <div class="hud-item"><span class="hud-label">SCORE</span><span class="hud-value" id="score">0</span></div>
    <div class="hud-item" style="align-items:flex-end"><span class="hud-label">BEST</span><span class="hud-value" id="best">0</span></div>
  </div>
  <div id="multiplier"><div id="multiplier-dot"></div><span id="multiplier-txt">x1</span></div>
  <div id="speedup">SPEED UP!</div>

  <div id="startScreen" class="screen active">
    <div class="title">COLOR<br><span>SWITCH</span><br>RUSH</div>
    <div class="subtitle">Match the gate's top color. Tap, click, or press Space to switch. Don't crash.</div>
    <div class="dots"><div class="dot" style="background:#FF3B30;color:#FF3B30"></div><div class="dot" style="background:#4CD964;color:#4CD964"></div><div class="dot" style="background:#007AFF;color:#007AFF"></div><div class="dot" style="background:#FFCC00;color:#FFCC00"></div></div>
    <button class="btn btn-primary" id="playBtn">TAP TO PLAY</button>
    <div class="legend"><span>TAP / CLICK / SPACE to switch</span></div>
    <div class="hint">Audio respects system setting</div>
  </div>

  <div id="gameoverScreen" class="screen">
    <div class="score-big" id="finalScore">0</div>
    <div class="score-label">Final Score</div>
    <div id="crashReason" class="crash-reason"></div>
    <div class="color-preview" id="colorPreview" style="display:none"><div class="color-preview-ball" id="previewBall"></div><span style="font-size:12px;color:rgba(255,255,255,0.7)" id="previewText"></span></div>
    <button class="btn btn-primary" id="replayBtn">REPLAY</button>
    <div class="btn-row">
      <button class="btn btn-ghost" id="continueBtn">CONTINUE (AD)</button>
      <button class="btn btn-ghost" id="shareBtn">SHARE</button>
    </div>
  </div>
</div>

<script>
// YT SDK REQUIRED - guard
const IN_PLAYABLES_ENV = (typeof ytgame !== 'undefined');

// YT SDK REQUIRED - firstFrameReady immediately
if(IN_PLAYABLES_ENV){
  try{ if(ytgame.game && ytgame.game.firstFrameReady) ytgame.game.firstFrameReady(); }catch(e){}
}

// YT SDK REQUIRED - audio handling
let isMuted = false;
function updateAudioState(){
  if(IN_PLAYABLES_ENV && ytgame.system){
    try{
      if(typeof ytgame.system.isAudioEnabled !== 'undefined'){
        isMuted = !ytgame.system.isAudioEnabled;
      }
    }catch(e){}
  }
}
updateAudioState();
if(IN_PLAYABLES_ENV && ytgame.system){
  try{
    ytgame.system.onAudioEnabledChange = function(enabled){
      isMuted = !enabled;
    };
  }catch(e){}
}

// YT SDK REQUIRED - language
function getPlayablesLanguage(){
  if(IN_PLAYABLES_ENV){
    try{
      if(ytgame.system && ytgame.system.getLanguage) return ytgame.system.getLanguage();
      if(ytgame.game && ytgame.game.getLanguage) return ytgame.game.getLanguage();
      if(ytgame.system && ytgame.system.language) return ytgame.system.language;
    }catch(e){}
  }
  return (navigator.language || 'en').slice(0,2);
}

// YT SDK REQUIRED - pause/resume
let isPaused = false;
let pauseResolver = null;
function setupPauseResume(){
  if(!IN_PLAYABLES_ENV) return;
  try{
    const pauseFn = () => { isPaused = true; saveData({bestScore, score, _paused:true}); };
    const resumeFn = () => { isPaused = false; lastTime = performance.now(); requestAnimationFrame(loop); };
    if(ytgame.game){
      ytgame.game.onPause = pauseFn;
      ytgame.game.onResume = resumeFn;
    }
    if(ytgame.system){
      ytgame.system.onPause = pauseFn;
      ytgame.system.onResume = resumeFn;
    }
    document.addEventListener('visibilitychange', ()=>{
      if(document.hidden) pauseFn(); else resumeFn();
    });
  }catch(e){}
}

// YT SDK REQUIRED - loadData/saveData with localStorage fallback
const STORAGE_KEY = 'colorSwitchRush_save_v2';
async function loadData(){
  // YT SDK REQUIRED - loadData
  if(IN_PLAYABLES_ENV){
    try{
      if(ytgame.game && ytgame.game.loadData){
        const data = await ytgame.game.loadData();
        if(data){
          try{
            const parsed = typeof data === 'string' ? JSON.parse(data) : data;
            return parsed;
          }catch(e){ return {bestScore:0}; }
        }
      }
    }catch(e){}
  }
  try{
    const ls = localStorage.getItem(STORAGE_KEY);
    if(ls) return JSON.parse(ls);
  }catch(e){}
  return {bestScore:0};
}
async function saveData(obj){
  // YT SDK REQUIRED - saveData
  if(IN_PLAYABLES_ENV){
    try{
      if(ytgame.game && ytgame.game.saveData){
        await ytgame.game.saveData(JSON.stringify(obj));
        return;
      }
    }catch(e){}
  }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }catch(e){}
}

// YT SDK REQUIRED - sendScore
async function sendScore(score){
  if(IN_PLAYABLES_ENV){
    try{
      if(ytgame.game && ytgame.game.sendScore) await ytgame.game.sendScore(score);
      if(ytgame.game && ytgame.game.submitScore) await ytgame.game.submitScore(score);
    }catch(e){}
  }
}

// YT SDK REQUIRED - ads
async function requestInterstitial(){
  if(IN_PLAYABLES_ENV){
    try{
      if(ytgame.game && ytgame.game.requestInterstitialAd){
        await ytgame.game.requestInterstitialAd();
        return true;
      }
      if(ytgame.game && ytgame.game.showInterstitialAd){
        await ytgame.game.showInterstitialAd();
        return true;
      }
    }catch(e){ return false; }
  }
  return false;
}
async function requestRewarded(id){
  if(IN_PLAYABLES_ENV){
    try{
      if(ytgame.game && ytgame.game.requestRewardedAd){
        const res = await ytgame.game.requestRewardedAd(id || 'continue-after-crash');
        return !!res;
      }
      if(ytgame.game && ytgame.game.showRewardedAd){
        const res = await ytgame.game.showRewardedAd(id);
        return !!res;
      }
    }catch(e){ return false; }
  }
  // fallback for local testing - allow continue 1 time
  return true;
}

// GAME CODE - vanilla canvas
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false});
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1,2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize(); window.addEventListener('resize', resize);

const COLORS = ['#FF3B30','#4CD964','#007AFF','#FFCC00'];
const COLOR_NAMES = ['RED','GREEN','BLUE','YELLOW'];

let bestScore = 0;
let score = 0;
let multiplier = 1;
let fallSpeed = 3.2;
let baseRotationSpeed = 0.9;
let rotationMult = 1;
let elapsed = 0;
let lastTime = 0;
let gameState = 'start'; // start, playing, gameover
let canContinue = true;

const ball = {
  worldY: 0,
  colorIdx: 0,
  trail: [],
  scale: 1,
  crashTime: 0
};

let gates = [];
let particles = [];
let nextGateY = 0;
let speedLevel = 0;

function rand(min,max){ return Math.random()*(max-min)+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function createGate(worldY){
  return {
    worldY,
    rotation: Math.random()*Math.PI*2,
    rotSpeed: (Math.random()>0.5?1:-1) * rand(0.6,1.4),
    radius: rand(54,72),
    thickness: 18,
    passed:false,
    id: Math.random()
  };
}
function resetGates(){
  gates = [];
  nextGateY = 420;
  for(let i=0;i<6;i++){
    gates.push(createGate(nextGateY));
    nextGateY += rand(260,360);
  }
}
function spawnGateIfNeeded(cameraY){
  const last = gates[gates.length-1];
  if(!last) return;
  if(last.worldY - cameraY < H + 400){
    gates.push(createGate(nextGateY));
    nextGateY += rand(260,360);
    if(gates.length>12) gates.shift();
  }
}
function getTopColorIndex(gate){
  // top direction -PI/2
  const topAngle = -Math.PI/2;
  let diff = topAngle - gate.rotation;
  diff = ((diff % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const idx = Math.floor(diff / (Math.PI/2)) % 4;
  return idx;
}

function cycleBallColor(){
  if(gameState!=='playing') return;
  ball.colorIdx = (ball.colorIdx+1)%4;
  ball.scale = 1.35;
  // small particle burst on switch
  for(let i=0;i<6;i++){
    particles.push({
      x:W/2 + rand(-6,6), y:H*0.28 + rand(-6,6),
      vx: rand(-2.5,2.5), vy: rand(-2.5,2.5),
      r: rand(2,4), color: COLORS[ball.colorIdx],
      life:1, decay:0.06, type:'switch'
    });
  }
}

function triggerPassParticles(gateScreenY, color){
  for(let i=0;i<18;i++){
    const ang = Math.random()*Math.PI*2;
    const sp = rand(2,7);
    particles.push({
      x:W/2 + Math.cos(ang)*gate.radius*0.5, y:gateScreenY + Math.sin(ang)*gate.radius*0.5,
      vx: Math.cos(ang)*sp + rand(-1,1), vy: Math.sin(ang)*sp + rand(-1,1),
      r: rand(2.5,5), color, life:1, decay: rand(0.02,0.04), type:'pass'
    });
  }
}
function triggerCrashParticles(){
  const col = COLORS[ball.colorIdx];
  for(let i=0;i<28;i++){
    const ang = Math.random()*Math.PI*2;
    const sp = rand(3,9);
    particles.push({
      x:W/2, y:H*0.28,
      vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      r: rand(3,7), color:col,
      life:1, decay: rand(0.018,0.035), type:'crash'
    });
  }
}

function checkCollision(){
  const ballWorldY = ball.worldY;
  for(let gate of gates){
    if(gate.passed) continue;
    if(Math.abs(gate.worldY - ballWorldY) < 18){
      const topIdx = getTopColorIndex(gate);
      if(topIdx === ball.colorIdx){
        gate.passed = true;
        const pts = 10*multiplier;
        score += pts;
        multiplier++;
        triggerPassParticles(H*0.28, COLORS[topIdx]);
        updateHUD();
        if(multiplier>1){
          const mEl = document.getElementById('multiplier');
          document.getElementById('multiplier-txt').textContent = 'x'+multiplier;
          document.getElementById('multiplier-dot').style.background = COLORS[ball.colorIdx];
          document.getElementById('multiplier-dot').style.boxShadow = '0 0 12px '+COLORS[ball.colorIdx];
          mEl.classList.add('show');
          setTimeout(()=>mEl.classList.remove('show'), 1200);
        }
      }else{
        // crash
        gameOver(gate, topIdx);
        return;
      }
    }
  }
}

function gameOver(gate, topIdx){
  gameState = 'gameover';
  ball.crashTime = performance.now();
  triggerCrashParticles();
  const finalEl = document.getElementById('finalScore');
  finalEl.textContent = score;
  const reasonEl = document.getElementById('crashReason');
  const topColorName = COLOR_NAMES[topIdx];
  const ballColorName = COLOR_NAMES[ball.colorIdx];
  reasonEl.textContent = 'Gate needed '+topColorName+' but you were '+ballColorName+'.';
  const preview = document.getElementById('colorPreview');
  preview.style.display='flex';
  document.getElementById('previewBall').style.background = COLORS[ball.colorIdx];
  document.getElementById('previewBall').style.color = COLORS[ball.colorIdx];
  document.getElementById('previewText').textContent = ballColorName+' → needed '+topColorName;

  document.getElementById('gameoverScreen').classList.add('active');
  if(score>bestScore){ bestScore=score; saveData({bestScore}); document.getElementById('best').textContent = bestScore; }
  sendScore(score);
  canContinue = true;
  document.getElementById('continueBtn').style.display = canContinue ? 'inline-flex' : 'none';
}

function updateHUD(){
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = bestScore;
}

function drawBackground(){
  // subtle vignette + grid dots
  ctx.fillStyle = '#07080F';
  ctx.fillRect(0,0,W,H);
  const grad = ctx.createRadialGradient(W/2, H*0.15, 0, W/2, H*0.15, Math.max(W,H)*0.9);
  grad.addColorStop(0,'rgba(26,29,58,0.9)');
  grad.addColorStop(0.5,'rgba(10,12,28,0.6)');
  grad.addColorStop(1,'rgba(7,8,15,1)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  // faint center line glow
  ctx.save();
  ctx.globalAlpha=0.08;
  ctx.strokeStyle='#fff';
  ctx.lineWidth=1;
  ctx.setLineDash([6,14]);
  ctx.beginPath();
  ctx.moveTo(W/2,0); ctx.lineTo(W/2,H);
  ctx.stroke();
  ctx.restore();
}

function drawGates(cameraY){
  for(let gate of gates){
    const screenY = gate.worldY - cameraY;
    if(screenY < -120 || screenY > H+120) continue;
    const r = gate.radius;
    const thick = gate.thickness;
    // glow
    ctx.save();
    ctx.shadowBlur=24; ctx.shadowColor='rgba(255,255,255,0.15)';
    ctx.strokeStyle='rgba(255,255,255,0.04)';
    ctx.lineWidth=thick+10;
    ctx.beginPath(); ctx.arc(W/2, screenY, r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();

    for(let i=0;i<4;i++){
      const start = gate.rotation + i*(Math.PI/2);
      const end = start + Math.PI/2 - 0.06;
      ctx.save();
      ctx.strokeStyle = COLORS[i];
      ctx.lineWidth = thick;
      ctx.lineCap='round';
      ctx.shadowBlur=14; ctx.shadowColor=COLORS[i];
      ctx.globalAlpha = gate.passed ? 0.18 : 1;
      ctx.beginPath();
      ctx.arc(W/2, screenY, r, start, end);
      ctx.stroke();
      // inner highlight
      ctx.globalAlpha = gate.passed ? 0.08 : 0.35;
      ctx.lineWidth = 2;
      ctx.shadowBlur=0;
      ctx.beginPath();
      ctx.arc(W/2, screenY, r-6, start+0.08, end-0.08);
      ctx.stroke();
      ctx.restore();
    }
    // top indicator small triangle
    if(!gate.passed){
      const topIdx = getTopColorIndex(gate);
      const topAng = -Math.PI/2;
      ctx.save();
      ctx.translate(W/2, screenY);
      ctx.rotate(topAng);
      ctx.fillStyle = COLORS[topIdx];
      ctx.shadowBlur=10; ctx.shadowColor=COLORS[topIdx];
      ctx.beginPath();
      ctx.moveTo(r+14,0); ctx.lineTo(r+4,-6); ctx.lineTo(r+4,6);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
}

function drawBall(){
  // trail
  for(let i=0;i<ball.trail.length;i++){
    const t = ball.trail[i];
    const alpha = (i/ball.trail.length)*0.55;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.fillStyle=t.color;
    ctx.shadowBlur=12; ctx.shadowColor=t.color;
    ctx.beginPath(); ctx.arc(t.x, t.y, 7*(0.5+i/ball.trail.length*0.5),0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // ball
  ctx.save();
  ctx.translate(W/2, H*0.28);
  ctx.scale(ball.scale, ball.scale);
  const col = COLORS[ball.colorIdx];
  // outer glow
  ctx.shadowBlur=28; ctx.shadowColor=col;
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(0,0,13,0,Math.PI*2); ctx.fill();
  // inner core
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-2,-2,4,0,Math.PI*2); ctx.fill();
  ctx.restore();
  if(ball.scale>1){ ball.scale += (1-ball.scale)*0.18; if(Math.abs(ball.scale-1)<0.01) ball.scale=1; }
}

function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=0.985; p.vy*=0.985; p.vy+=0.08; p.life-=p.decay;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.save();
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.shadowBlur=10; ctx.shadowColor=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function loop(now){
  if(isPaused){ return; }
  if(!lastTime) lastTime=now;
  const dt = Math.min(32, now-lastTime);
  lastTime=now;
  if(gameState!=='playing'){ requestAnimationFrame(loop); return; }

  elapsed+=dt;
  // speed increase every 8 sec
  const newLevel = Math.floor(elapsed/8000);
  if(newLevel>speedLevel){
    speedLevel=newLevel;
    fallSpeed+=0.42;
    rotationMult+=0.18;
    const su = document.getElementById('speedup');
    su.classList.add('show');
    setTimeout(()=>su.classList.remove('show'), 900);
  }

  ball.worldY += fallSpeed * (dt/16.666);
  ball.trail.push({x:W/2 + rand(-1,1), y:H*0.28 + rand(-1,1), color:COLORS[ball.colorIdx]});
  if(ball.trail.length>14) ball.trail.shift();

  const cameraY = ball.worldY - H*0.28;
  for(let g of gates){
    g.rotation += g.rotSpeed * rotationMult * (dt/16.666) * 0.02;
  }
  spawnGateIfNeeded(cameraY);
  checkCollision();

  drawBackground();
  drawGates(cameraY);
  drawBall();
  drawParticles();

  if(gameState==='playing') requestAnimationFrame(loop);
}

(async function init(){

  bestScore = data.bestScore||0;

})();

function handleInput(e){

  }
}
function startGame(){
  score=0; multiplier=1; fallSpeed=3.2; rotationMult=1; elapsed=0; speedLevel=0;
  ball.worldY=0; ball.colorIdx=Math.floor(Math.random()*4); ball.trail=[]; ball.scale=1;
  resetGates();
  particles=[];
  gameState='playing';
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('gameoverScreen').classList.remove('active');
  updateHUD();
  lastTime=performance.now();
  requestAnimationFrame(loop);

canvas.addEventListener('pointerdown', handleInput, {passive:false});
document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('playBtn').addEventListener('pointerdown', (e)=>{e.stopPropagation(); startGame();});
window.addEventListener('keydown', (e)=>{
  if(e.code==='Space'){ e.preventDefault(); handleInput(); }
});

document.getElementById('replayBtn').addEventListener('click', async ()=>{
  // YT SDK REQUIRED - interstitial on replay
  await requestInterstitial();
  startGame();
});
document.getElementById('continueBtn').addEventListener('click', async ()=>{
  if(!canContinue) return;
  const btn = document.getElementById('continueBtn');
  btn.textContent='LOADING AD...';
  btn.disabled=true;
  const ok = await requestRewarded('continue-after-crash');
  btn.textContent='CONTINUE (AD)';
  btn.disabled=false;
  if(ok){
    // continue after crash - remove last gate and resume
    // find gate that caused crash and mark passed
    for(let g of gates){ if(Math.abs(g.worldY-ball.worldY)<24){ g.passed=true; } }
    canContinue=false;
    document.getElementById('gameoverScreen').classList.remove('active');
    gameState='playing';
    multiplier=1;
    lastTime=performance.now();
    requestAnimationFrame(loop);
  }else{
    startGame();
  }
});
document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const text = 'I scored '+score+' in Color Switch Rush!';
  try{
    if(navigator.share){ await navigator.share({title:'Color Switch Rush', text}); }
    else if(navigator.clipboard){ await navigator.clipboard.writeText(text); alert('Score copied: '+text); }
    else{ alert(text); }
  }catch(e){}
});
